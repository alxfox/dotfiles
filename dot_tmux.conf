# Small, portable additions to tmux defaults.
set-option -g mouse on
set-option -g history-limit 50000

# Reload without replacing the default Prefix-r binding.
bind-key R source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Restore sessions after tmux restarts when TPM is installed. Saved state
# remains machine-local.
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
set-option -g @plugin 'tmux-plugins/tmux-continuum'
set-option -g @continuum-restore 'on'

# Keep TPM initialization last.
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' "run-shell '~/.tmux/plugins/tpm/tpm'"
